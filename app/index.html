<style>
:root{
  --bg:#f6f5f2; --surface:#fcfcfb; --surface-2:#f0efeb; --line:#e3e1db;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#8a8984;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --seq1:#cde2fb; --seq3:#86b6ef; --seq5:#3987e5; --seq7:#1c5cab; --seq9:#0d366b;
  --good:#0f7b3e; --warn:#a86500; --bad:#b42318; --accent:#14532d;
  --radius:10px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;background:#10291c;color:#f2f1ec;position:sticky;top:0;z-index:20}
header .logo{font-weight:700;letter-spacing:.2px;font-size:16px}
header .logo small{display:block;font-weight:400;opacity:.7;font-size:11.5px}
header .sp{flex:1}
header .rev{font-size:12px;display:flex;gap:8px;align-items:center}
header input{background:#1d3d2b;border:1px solid #2f5a41;color:#fff;border-radius:6px;padding:5px 8px;width:150px}
nav{display:flex;gap:2px;padding:0 24px;background:#10291c;overflow-x:auto;position:sticky;top:58px;z-index:19}
nav button{background:none;border:0;color:#b9c9bf;padding:10px 14px;font:inherit;font-weight:500;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-bottom-color:#7bd39b}
main{max-width:1280px;margin:0 auto;padding:22px 24px 80px}
h1{font-size:22px;margin:0 0 4px} h2{font-size:17px;margin:0 0 10px} h3{font-size:14px;margin:0 0 8px;color:var(--ink-2);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
p.lead{color:var(--ink-2);margin:0 0 18px;max-width:900px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.kpi .v{font-size:26px;font-weight:650;letter-spacing:-.5px}
.kpi .l{color:var(--ink-2);font-size:12.5px}
.kpi .s{color:var(--ink-3);font-size:12px;margin-top:4px}
.src{font-family:var(--mono);font-size:11px;color:var(--ink-3);cursor:help;border-bottom:1px dotted var(--ink-3)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--ink-2);border-bottom:1px solid var(--line);padding:7px 8px;position:sticky;top:0;background:var(--surface);font-size:12px}
td{border-bottom:1px solid var(--surface-2);padding:6px 8px;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.pill.ok{background:#e3f4e9;color:var(--good)} .pill.wa{background:#fdf1dc;color:var(--warn)} .pill.no{background:#fde7e5;color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.btn:hover{background:var(--surface-2)} .btn.pri{background:#14532d;color:#fff;border-color:#14532d} .btn.sm{padding:2px 7px;font-size:11.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,input[type=text],textarea{font:inherit;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--surface)}
.reviewbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:9px;background:#fffbea;border:1px solid #f1e3a6;margin:0 0 16px;font-size:13px}
.reviewbar.approved{background:#e9f6ee;border-color:#b9e2c7}
.chart{width:100%;overflow:visible}
.chart text{font-size:11px;fill:var(--ink-2)}
.chart .axis line,.chart .grid line{stroke:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#tourbar{position:fixed;left:0;right:0;bottom:0;z-index:50}
#tourbar .in{max-width:1280px;margin:0 auto 14px;background:#10291c;color:#f2f1ec;border-radius:12px;padding:12px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#tourbar .in .btn{background:#1d3d2b;color:#fff;border-color:#2f5a41}
#tourbar .in .btn.pri{background:#7bd39b;color:#10291c;border-color:#7bd39b;font-weight:600}
.hero{background:linear-gradient(135deg,#10291c,#1c4a31);color:#f2f1ec;border-radius:14px;padding:26px 28px;margin-bottom:18px}
.hero h1{color:#fff;font-size:26px}
.hero .big{font-size:30px;font-weight:700;color:#7bd39b}
.hero .lbl{font-size:13px;color:#c9d6cd}
#tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:7px 9px;border-radius:7px;font-size:12px;max-width:340px;z-index:99;display:none;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.action{border-left:4px solid var(--s1);padding:10px 12px;background:var(--surface);border-radius:0 8px 8px 0;margin-bottom:8px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.action b{display:block} .action .m{color:var(--ink-2);font-size:12.5px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:560px;overflow:auto;padding:4px}
.msg{padding:10px 12px;border-radius:10px;max-width:88%;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:#14532d;color:#fff}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.msg .ev{margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.muted{color:var(--ink-3)} .small{font-size:12px}
.tag{font-family:var(--mono);font-size:11px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.flow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.flow .st{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px}
.flow .st b{display:block;font-size:12.5px} .flow .st span{font-size:11.5px;color:var(--ink-2)}
.flow .ar{align-self:center;color:var(--ink-3)}
.map path{stroke:#fff;stroke-width:.6}
.map path:hover{stroke:#111;stroke-width:1.5}
</style>

ence":"Estimate: register pea area x survey yield (median for non-respondents): 7,114 t -> 8,025 t. ERP has no 2026 lines."},{"id":"E19","question":"By how many percent did Swedish (Foodhills) pea deliveries change from 2025 to 2026?","answer":"-13.019","answer_short":"-13.0","unit":"%","evidence":"foodhills_odlingsdata_se.csv levererad_m\u00e4ngd_ton: 16,829.9 t (2025) -> 14,638.8 t (2026)"},{"id":"E20","question":"Illustrative: with 2025 as base year and the SBTi minimum 4.2 %/yr linear rate for Scope 1+2, what is a 2032 absolute Scope 1+2 (market-based) target in tCO2e?","answer":"3159.231","answer_short":"3,159","unit":"tCO2e","evidence":"2025 S1+S2MB 4,474.8 t x (1 - 0.042 x 7)"},{"id":"E21","question":"Illustrative: with 2025 as base year and the SBTi FLAG minimum 3.03 %/yr linear rate, what is a 2032 FLAG target in tCO2e?","answer":"127786.589","answer_short":"127,787","unit":"tCO2e","evidence":"2025 FLAG 162,186.3 t x (1 - 0.0303 x 7)"},{"id":"E90","question":"What were total Scope 1 emissions in 2024 (tCO2e)?","answer":"6399.913","answer_short":"6,400","unit":"tCO2e","evidence":"2024 scope1_total"},{"id":"E91","question":"What were market-based Scope 2 emissions in 2024 (tCO2e)?","answer":"63.237","answer_short":"63.2","unit":"tCO2e","evidence":"2024 scope2_market_total"},{"id":"E92","question":"What were Scope 3 category 1 emissions in 2024 (tCO2e)?","answer":"172572.656","answer_short":"172,573","unit":"tCO2e","evidence":"2024 cat01 goods+services"},{"id":"E30","question":"Is Apetit required to set a separate SBTi FLAG target, and why?","answer":"Yes. SBTi requires a separate FLAG target for companies in food production and food & beverage processing regardless of FLAG share, and for any company whose FLAG emissions exceed 20 % of the total. Apetit is a food processor (frozen vegetables, vegetable oil) with ~1,000 contract growers, so FLAG is mandatory; in this dataset FLAG (on-farm N2O, drained organic soils, liming, plus FLAG share of purchased commodities) is also a large share of Scope 3 cat 1. The FLAG target must be accompanied by a no-deforestation commitment (cut-off no later than 2020).","answer_short":"Yes.","unit":"","evidence":"data/07_frameworks/framework_digest.md \u00a7Climate targets: SBTi > FLAG; SBTi FLAG guidance (source_registry.csv row 'SBTi FLAG'); docs/METHODOLOGY.md \u00a75 FLAG part"},{"id":"E31","question":"What minimum linear annual reduction rates apply for near-term targets under SBTi Corporate Net-Zero Standard V1.3.1 for (a) Scope 1+2, (b) Scope 3 well-below 2 C, (c) FLAG?","answer":"(a) Scope 1+2: at least 4.2 %/yr linear reduction (1.5 \u00b0C-aligned). (b) Scope 3: at least 2.5 %/yr linear (well-below 2 \u00b0C). (c) FLAG: at least 3.03 %/yr linear. Near-term targets cover 5\u201310 years from submission (V2: 5 years). Long-term: -90 % S1+2 and S3 by 2050, FLAG -72 %.","answer_short":"(a) Scope 1+2: at least 4.","unit":"","evidence":"data/07_frameworks/framework_digest.md \u00a7Minimum ambition (V1.3.1 method appendix); SBTi CNZS V1.3.1 Method Appendix (source_registry.csv)"},{"id":"E32","question":"The Finnish grain trade was divested in 2022 and Foodhills was acquired in 2025. What does this mean for a 2019 base year?","answer":"A 2019 base year must be recalculated under the GHG Protocol structural-change rule: remove the divested grain trade (Baltic sold 10 Mar 2022, Finnish 31 May 2022) from 2019 Scope 3 cat 1 as if it had never been owned, and add Foodhills (acquired 27 Nov 2025) for 2019 as if it had always been owned (own operations + ~300 SE pea growers in cat 1/FLAG). Published restatements (2022: 201,016 \u2192 186,430 t; 2023: 260,931 \u2192 237,886 t) show the grain-trade effect. Because Foodhills has no 2019 data, SBTi V2's preference for the most recent comprehensive year (2025, adjusted to full-year Foodhills) is the more defensible base; a 2019 base would require estimation and should be flagged as such. Pudasj\u00e4rvi closure (2026) and Kantvik steam sale (2027) are later structural changes that also trigger recalculation checks.","answer_short":"A 2019 base year must be recalculated under the GHG Protocol structural-change rule: remove the divested grain trade (Baltic sold 10 Mar 2022, Finnish 31 May 2022) from 2019 Scope 3 cat 1 as if it had never been owned, and add Foodhills (acquired 27 Nov 2025) for 2019 as if it had always been owned (own operations + ~300 SE pea growers in cat 1/FLAG).","unit":"","evidence":"data/05_scenarios/structural_events.csv rows 2022-03-10, 2022-05-31, 2025-11-27, 2026-04-13, 2026-06-30; data/05_scenarios/published_inventory_history.csv rows 2022, 2023; docs/METHODOLOGY.md \u00a71; framework_digest.md \u00a7Accounting: GHG Protocol (base-year recalculation); docs/SCENARIOS_AND_RISK.md Track B item 1"},{"id":"E33","question":"Does cancelling wind-power guarantees of origin reduce location-based Scope 2?","answer":"No. Location-based Scope 2 uses the grid-average production factor for the electricity consumed (FI 0.026 kg/kWh in 2025) regardless of contractual instruments. GoOs only affect the market-based figure: (MWh \u2212 valid GoO MWh) \u00d7 residual mix. A GoO counts only if its vintage year equals the consumption year and is backed by the national registry statement.","answer_short":"No.","unit":"","evidence":"docs/METHODOLOGY.md \u00a73 Scope 2 location-based / market-based; framework_digest.md \u00a7Scope 2; data/02_raw_feeds/goo_registry_statement.csv"},{"id":"E34","question":"Which contract-farming emission sources are FLAG and which are non-FLAG?","answer":"FLAG (land-based): direct N2O from fertiliser/manure/residues, indirect N2O (volatilisation, leaching), CO2 and N2O from drained organic soils, liming CO2, land-use change and soil carbon (and removals if reported under GHG Protocol LSR). Non-FLAG: fertiliser manufacture (e.g. 3.7 kg CO2e/kg N for AN, 0.9 low-carbon), farm diesel, electricity for storage/drying/irrigation, pesticide manufacture, and processing.","answer_short":"FLAG (land-based): direct N2O from fertiliser/manure/residues, indirect N2O (volatilisation, leaching), CO2 and N2O from drained organic soils, liming CO2, land-use change and soil carbon (and removals if reported under GHG Protocol LSR).","unit":"","evidence":"docs/METHODOLOGY.md \u00a75 (FLAG (SBTi) part); framework_digest.md \u00a7FLAG"},{"id":"E35","question":"Is rapeseed within the scope of the EU Deforestation Regulation? Is the soy protein isolate in this dataset?","answer":"Rapeseed is not a relevant commodity under the EUDR (commodities: cattle, cocoa, coffee, palm oil, rubber, soya, wood), so rapeseed is out of scope. Soy is in scope, but only for products listed by HS code in Annex I (soybeans 1201, soy oil 1507, soy meal 2304). Soy protein isolate (HS 3504) is not listed, so the soy protein isolate in this dataset is not in EUDR scope \u2014 but it remains an SBTN high-impact commodity and a deforestation-risk exposure; Annex I can be amended by delegated act, so screening must be by HS code and re-checked.","answer_short":"Rapeseed is not a relevant commodity under the EUDR (commodities: cattle, cocoa, coffee, palm oil, rubber, soya, wood), so rapeseed is out of scope.","unit":"","evidence":"data/07_frameworks/framework_digest.md \u00a7EU Deforestation Regulation; data/05_scenarios/structural_events.csv row 2026-12-30; data/01_master/materials.csv columns eudr_commodity, sbtn_high_impact_commodity; docs/APETIT_DATA_RECONCILIATION.md \u00a7Supplier factors"},{"id":"E36","question":"How does ESRS E3 (revised, 2026) define an area of water stress?","answer":"An area of water stress is one where WRI Aqueduct baseline water stress is 'high' (40\u201380 %) or above, or where the WEI+ (water exploitation index plus) is \u2265 40 %. Water consumption in such areas must be disclosed under E3.","answer_short":"An area of water stress is one where WRI Aqueduct baseline water stress is 'high' (40\u201380 %) or above, or where the WEI+ (water exploitation index plus) is \u2265 40 %.","unit":"","evidence":"data/07_frameworks/framework_digest.md \u00a7ESRS (revised, 2026) E3; EFRAG simplified ESRS E3 Delegated Act (source_registry.csv)"},{"id":"E37","question":"Can CO2 removals from catch crops be reported under the GHG Protocol Land Sector and Removals Standard, and under what conditions?","answer":"Yes, but optionally and conditionally. Under the GHG Protocol Land Sector and Removals Standard (v1.1, effective 1 Jan 2027) removals may be reported (they are optional) only if they are monitored with ongoing primary data, traceable to the specific land (parcels in the company's value chain), quantified with stated uncertainty, and with reversals accounted for (a reversal monitoring/permanence mechanism). Removals are reported separately from emissions, never netted into gross Scope 3. Catch-crop soil carbon gains are not modelled in this dataset and would need soil sampling/model-based MRV.","answer_short":"Yes, but optionally and conditionally.","unit":"","evidence":"data/07_frameworks/framework_digest.md \u00a7Land Sector and Removals Standard; docs/ASSUMPTIONS_AND_LIMITATIONS.md \u00a7Not modelled (removals); data/05_scenarios/decarbonisation_levers.csv row L10 trade_offs"},{"id":"E38","question":"Which SBTN step uses a materiality screening based on ENCORE, and which pressure categories does it cover?","answer":"SBTN Step 1a (Assess \u2013 materiality screening) uses ENCORE-based pressure ratings by sector/commodity. Pressure categories: land/freshwater/sea use change, water use (freshwater withdrawal), pollution (water and soil pollutants incl. nutrients N and P, pesticides), GHG emissions, other resource use, and disturbances/invasive species. In this dataset screening covers land use, water use, nutrient pollution, GHG and pesticides; SBTN 2.0 (Oct 2026) adds groundwater and pesticides explicitly.","answer_short":"SBTN Step 1a (Assess \u2013 materiality screening) uses ENCORE-based pressure ratings by sector/commodity.","unit":"","evidence":"docs/NATURE_SBTN.md \u00a7Mapping to SBTN steps (1a); framework_digest.md \u00a7SBTN; SBTN Step 1a materiality screening (source_registry.csv)"},{"id":"E39","question":"Why is a reported reduction from switching spend-based to supplier-specific factors not an emission reduction?","answer":"Because the atmosphere sees no change: the same physical goods with the same production emissions are bought; only the estimation method changes (spend \u00d7 EEIO average \u2192 supplier-specific PCF). Under the GHG Protocol this is a methodology change, which requires recalculating the base year (if significant) so that base and target years use comparable methods. Reporting it as a reduction would misstate progress against SBTi targets. In our pathway, lever L27 is shown as a measurement change with 0 t abatement.","answer_short":"Because the atmosphere sees no change: the same physical goods with the same production emissions are bought; only the estimation method changes (spend \u00d7 EEIO average \u2192 supplier-specific PCF).","unit":"","evidence":"data/05_scenarios/decarbonisation_levers.csv row L27 ('reported change is not a real reduction'); framework_digest.md \u00a7Accounting: GHG Protocol (methodology changes above significance threshold); docs/TASKS_AND_SCORING.md \u00a7B1/B2"}],"kb":[{"title":"What were Scope 1 emissions from LNG and LPG combustion at the S\u00e4kyl\u00e4 plant in 2025 (tCO2e)?","text":"What were Scope 1 emissions from LNG and LPG combustion at the S\u00e4kyl\u00e4 plant in 2025 (tCO2e)?\nAnswer: 2100.611 tCO2e","evidence":"lines_long.csv 2025 scope1 S-SAK:lng + S-SAK:lpg; fuel_deliveries (t) x NCV 13.5/12.8 MWh/t - stock change; EF 0.1991/0.2336 t/MWh"},{"title":"What were market-based Scope 2 emissions in 2025 after reconciling the internal GoO log with the registry statement (tCO2e)?","text":"What were market-based Scope 2 emissions in 2025 after reconciling the internal GoO log with the registry statement (tCO2e)?\nAnswer: 60.9 ct pea deliveries change from 2025 to 2026?","text":"By how many percent did Finnish contract pea deliveries change from 2025 to 2026?\nAnswer: 12.816 %","evidence":"Estimate: register pea area x survey yield (median for non-respondents): 7,114 t -> 8,025 t. ERP has no 2026 lines."},{"title":"By how many percent did Swedish (Foodhills) pea deliveries change from 2025 to 2026?","text":"By how many percent did Swedish (Foodhills) pea deliveries change from 2025 to 2026?\nAnswer: -13.019 %","evidence":"foodhills_odlingsdata_se.csv levererad_m\u00e4ngd_ton: 16,829.9 t (2025) -> 14,638.8 t (2026)"},{"title":"Illustrative: with 2025 as base year and the SBTi minimum 4.2 %/yr linear rate for Scope 1+2, what is a 2032 absolute Scope 1+2 (market-based) target in tCO2e?","text":"Illustrative: with 2025 as base year and the SBTi minimum 4.2 %/yr linear rate for Scope 1+2, what is a 2032 absolute Scope 1+2 (market-based) target in tCO2e?\nAnswer: 3159.231 tCO2e","evidence":"2025 S1+S2MB 4,474.8 t x (1 - 0.042 x 7)"},{"title":"Illustrative: with 2025 as base year and the SBTi FLAG minimum 3.03 %/yr linear rate, what is a 2032 FLAG target in tCO2e?","text":"Illustrative: with 2025 as base year and the SBTi FLAG minimum 3.03 %/yr linear rate, what is a 2032 FLAG target in tCO2e?\nAnswer: 127786.589 tCO2e","evidence":"2025 FLAG 162,186.3 t x (1 - 0.0303 x 7)"},{"title":"What were total Scope 1 emissions in 2024 (tCO2e)?","text":"What were total Scope 1 emissions in 2024 (tCO2e)?\nAnswer: 6399.913 tCO2e","evidence":"2024 scope1_total"},{"title":"What were market-based Scope 2 emissions in 2024 (tCO2e)?","text":"What were market-based Scope 2 emissions in 2024 (tCO2e)?\nAnswer: 63.237 tCO2e","evidence":"2024 scope2_market_total"},{"title":"What were Scope 3 category 1 emissions in 2024 (tCO2e)?","text":"What were Scope 3 category 1 emissions in 2024 (tCO2e)?\nAnswer: 172572.656 tCO2e","evidence":"2024 cat01 goods+services"},{"title":"Is Apetit required to set a separate SBTi FLAG target, and why?","text":"Is Apetit required to set a separate SBTi FLAG target, and why?\nAnswer: Yes. SBTi requires a separate FLAG target for companies in food production and food & beverage processing regardless of FLAG share, and for any company whose FLAG emissions exceed 20 % of the total. Apetit is a food processor (frozen vegetables, vegetable oil) with ~1,000 contract growers, so FLAG is mandatory; in this dataset FLAG (on-farm N2O, drained organic soils, liming, plus FLAG share of purchased commodities) is also a large share of Scope 3 cat 1. The FLAG target must be accompanied by a no-deforestation commitment (cut-off no later than 2020). ","evidence":"data/07_frameworks/framework_digest.md \u00a7Climate targets: SBTi > FLAG; SBTi FLAG guidance (source_registry.csv row 'SBTi FLAG'); docs/METHODOLOGY.md \u00a75 FLAG part"},{"title":"What minimum linear annual reduction rates apply for near-term targets under SBTi Corporate Net-Zero Standard V1.3.1 for (a) Scope 1+2, (b) Scope 3 well-below 2 C, (c) FLAG?","text":"What minimum linear annual reduction rates apply for near-term targets under SBTi Corporate Net-Zero Standard V1.3.1 for (a) Scope 1+2, (b) Scope 3 well-below 2 C, (c) FLAG?\nAnswer: (a) Scope 1+2: at least 4.2 %/yr linear reduction (1.5 \u00b0C-aligned). (b) Scope 3: at least 2.5 %/yr linear (well-below 2 \u00b0C). (c) FLAG: at least 3.03 %/yr linear. Near-term targets cover 5\u201310 years from submission (V2: 5 years). Long-term: -90 % S1+2 and S3 by 2050, FLAG -72 %. ","evidence":"data/07_frameworks/framework_digest.md \u00a7Minimum ambition (V1.3.1 method appendix); SBTi CNZS V1.3.1 Method Appendix (source_registry.csv)"},{"title":"The Finnish grain trade was divested in 2022 and Foodhills was acquired in 2025. What does this mean for a 2019 base year?","text":"The Finnish grain trade was divested in 2022 and Foodhills was acquired in 2025. What does this mean for a 2019 base year?\nAnswer: A 2019 base year must be recalculated under the GHG Protocol structural-change rule: remove the divested grain trade (Baltic sold 10 Mar 2022, Finnish 31 May 2022) from 2019 Scope 3 cat 1 as if it had never been owned, and add Foodhills (acquired 27 Nov 2025) for 2019 as if it had always been owned (own operations + ~300 SE pea growers in cat 1/FLAG). Published restatements (2022: 201,016 \u2192 186,430 t; 2023: 260,931 \u2192 237,886 t) show the grain-trade effect. Because Foodhills has no 2019 data, SBTi V2's preference for the most recent comprehensive year (2025, adjusted to full-year Foodhills) is the more defensible base; a 2019 base would require estimation and should be flagged as such. Pudasj\u00e4rvi closure (2026) and Kantvik steam sale (2027) are later structural changes that also trigger recalculation checks. ","evidence":"data/05_scenarios/structural_events.csv rows 2022-03-10, 2022-05-31, 2025-11-27, 2026-04-13, 2026-06-30; data/05_scenarios/published_inventory_history.csv rows 2022, 2023; docs/METHODOLOGY.md \u00a71; framework_digest.md \u00a7Accounting: GHG Protocol (base-year recalculation); docs/SCENARIOS_AND_RISK.md Track B item 1"},{"title":"Does cancelling wind-power guarantees of origin reduce location-based Scope 2?","text":"Does cancelling wind-power guarantees of origin reduce location-based Scope 2?\nAnswer: No. Location-based Scope 2 uses the grid-average production factor for the electricity consumed (FI 0.026 kg/kWh in 2025) regardless of contractual instruments. GoOs only affect the market-based figure: (MWh \u2212 valid GoO MWh) \u00d7 residual mix. A GoO counts only if its vintage year equals the consumption year and is backed by the national registry statement. ","evidence":"docs/METHODOLOGY.md \u00a73 Scope 2 location-based / market-based; framework_digest.md \u00a7Scope 2; data/02_raw_feeds/goo_registry_statement.csv"},{"title":"Which contract-farming emission sources are FLAG and which are non-FLAG?","text":"Which contract-farming emission sources are FLAG and which are non-FLAG?\nAnswer: FLAG (land-based): direct N2O from fertiliser/manure/residues, indirect N2O (volatilisation, leaching), CO2 and N2O from drained organic soils, liming CO2, land-use change and soil carbon (and removals if reported under GHG Protocol LSR). Non-FLAG: fertiliser manufacture (e.g. 3.7 kg CO2e/kg N for AN, 0.9 low-carbon), farm diesel, electricity for storage/drying/irrigation, pesticide manufacture, and processing. ","evidence":"docs/METHODOLOGY.md \u00a75 (FLAG (SBTi) part); framework_digest.md \u00a7FLAG"},{"title":"Is rapeseed within the scope of the EU Deforestation Regulation? Is the soy protein isolate in this dataset?","text":"Is rapeseed within the scope of the EU Deforestation Regulation? Is the soy protein isolate in this dataset?\nAnswer: Rapeseed is not a relevant commodity under the EUDR (commodities: cattle, cocoa, coffee, palm oil, rubber, soya, wood), so rapeseed is out of scope. Soy is in scope, but only for products listed by HS code in Annex I (soybeans 1201, soy oil 1507, soy meal 2304). Soy protein isolate (HS 3504) is not listed, so the soy protein isolate in this dataset is not in EUDR scope \u2014 but it remains an SBTN high-impact commodity and a deforestation-risk exposure; Annex I can be amended by delegated act, so screening must be by HS code and re-checked. ","evidence":"data/07_frameworks/framework_digest.md \u00a7EU Deforestation Regulation; data/05_scenarios/structural_events.csv row 2026-12-30; data/01_master/materials.csv columns eudr_commodity, sbtn_high_impact_commodity; docs/APETIT_DATA_RECONCILIATION.md \u00a7Supplier factors"},{"title":"How does ESRS E3 (revised, 2026) define an area of water stress?","text":"How does ESRS E3 (revised, 2026) define an area of water stress?\nAnswer: An area of water stress is one where WRI Aqueduct baseline water stress is 'high' (40\u201380 %) or above, or where the WEI+ (water exploitation index plus) is \u2265 40 %. Water consumption in such areas must be disclosed under E3. ","evidence":"data/07_frameworks/framework_digest.md \u00a7ESRS (revised, 2026) E3; EFRAG simplified ESRS E3 Delegated Act (source_registry.csv)"},{"title":"Can CO2 removals from catch crops be reported under the GHG Protocol Land Sector and Removals Standard, and under what conditions?","text":"Can CO2 removals from catch crops be reported under the GHG Protocol Land Sector and Removals Standard, and under what conditions?\nAnswer: Yes, but optionally and conditionally. Under the GHG Protocol Land Sector and Removals Standard (v1.1, effective 1 Jan 2027) removals may be reported (they are optional) only if they are monitored with ongoing primary data, traceable to the specific land (parcels in the company's value chain), quantified with stated uncertainty, and with reversals accounted for (a reversal monitoring/permanence mechanism). Removals are reported separately from emissions, never netted into gross Scope 3. Catch-crop soil carbon gains are not modelled in this dataset and would need soil sampling/model-based MRV. ","evidence":"data/07_frameworks/framework_digest.md \u00a7Land Sector and Removals Standard; docs/ASSUMPTIONS_AND_LIMITATIONS.md \u00a7Not modelled (removals); data/05_scenarios/decarbonisation_levers.csv row L10 trade_offs"},{"title":"Which SBTN step uses a materiality screening based on ENCORE, and which pressure categories does it cover?","text":"Which SBTN step uses a materiality screening based on ENCORE, and which pressure categories does it cover?\nAnswer: SBTN Step 1a (Assess \u2013 materiality screening) uses ENCORE-based pressure ratings by sector/commodity. Pressure categories: land/freshwater/sea use change, water use (freshwater withdrawal), pollution (water and soil pollutants incl. nutrients N and P, pesticides), GHG emissions, other resource use, and disturbances/invasive species. In this dataset screening covers land use, water use, nutrient pollution, GHG and pesticides; SBTN 2.0 (Oct 2026) adds groundwater and pesticides explicitly. ","evidence":"docs/NATURE_SBTN.md \u00a7Mapping to SBTN steps (1a); framework_digest.md \u00a7SBTN; SBTN Step 1a materiality screening (source_registry.csv)"},{"title":"Why is a reported reduction from switching spend-based to supplier-specific factors not an emission reduction?","text":"Why is a reported reduction from switching spend-based to supplier-specific factors not an emission reduction?\nAnswer: Because the atmosphere sees no change: the same physical goods with the same production emissions are bought; only the estimation method changes (spend \u00d7 EEIO average \u2192 supplier-specific PCF). Under the GHG Protocol this is a methodology change, which requires recalculating the base year (if significant) so that base and target years use comparable methods. Reporting it as a reduction would misstate progress against SBTi targets. In our pathway, lever L27 is shown as a measurement change with 0 t abatement. ","evidence":"data/05_scenarios/decarbonisation_levers.csv row L27 ('reported change is not a real reduction'); framework_digest.md \u00a7Accounting: GHG Protocol (methodology changes above significance threshold); docs/TASKS_AND_SCORING.md \u00a7B1/B2"},{"title":"2025 scope1 fugitive_refrigerants","text":"2025 scope1 fugitive refrigerants: 908.4 tCO2e. kg top-up x AR6 GWP100; gas-code and g/kg fixes applied","evidence":"submissions/A2_inventory_2025_submission.csv \u00b7 A/lines_long.csv"},{"title":"2025 scope1 stationary_and_mobile_combustion","text":"2025 scope1 stationary and mobile combustion: 3,505.6 tCO2e. fuel MWh (NCV; deliveries - stock change) x fossil EF; m3/l fixes","evidence":"submissions/A2_inventory_2025_submission.csv \u00b7 A/lines_long.csv"},{"title":"2025 scope2_location purchased_electricity","text":"2025 scope2_location purchased electricity: 962.6 tCO2e. meter MWh (kWh/spike/gap corrected) x grid avg (LB) | uncovered MWh x residual mix (MB), registry GoOs","evidence":"submissions/A2_inventory_2025_submission.csv \u00b7 A/lines_long.csv"},{ _extra_tco2e=583","evidence":"C/c3_euro_risk.csv"},{"title":"Framework digest (status 3 November 2026)","text":"# Framework digest (status 3 November 2026)\n\nShort, original summaries of the rules this challenge touches, written for builders.\nThey are not substitutes for the source documents: download those from the links in\n`source_registry.csv` and cite them in your solution.  Several frameworks changed in 2026;\nthe dates below matter for anything Apetit decides in 2027.","evidence":"data/07_frameworks/framework_digest.md \u00a7 Framework digest (status 3 November 2026)"},{"title":"Apetit's status.** Committed in December 2025 to set near-term targets (24 months to submi","text":"* **Apetit's status.** Committed in December 2025 to set near-term targets (24 months to submit).","evidence":"data/07_frameworks/framework_digest.md \u00a7 Apetit's status.** Committed in December 2025 to set near-term targets (24 months to submi"},{"title":"Corporate Net-Zero Standard.** V2.0 published 11 June 2026, effective 1 February 2027.","text":"* **Corporate Net-Zero Standard.** V2.0 published 11 June 2026, effective 1 February 2027.\n  V1.3.1 remains usable until end-2027; V2 is mandatory for new and renewed targets from\n  31 January 2028.  V2 prefers the most recent year with comprehensive data as base year and\n  five-year near-term targets.","evidence":"data/07_frameworks/framework_digest.md \u00a7 Corporate Net-Zero Standard.** V2.0 published 11 June 2026, effective 1 February 2027."},{"title":"Minimum ambition (V1.3.1 method appendix).** Scope 1+2: 4.2 %/yr linear (1.5 C).","text":"* **Minimum ambition (V1.3.1 method appendix).** Scope 1+2: 4.2 %/yr linear (1.5 C).\n  Scope 3: 2.5 %/yr (well-below 2 C).  FLAG: 3.03 %/yr.  Long-term (net-zero): at least -90 %\n  for Scope 1+2 and for Scope 3 by 2050; FLAG -72 % by 2050.  Near-term targets cover 5-10 years\n  from submission (V2: 5 years).","evidence":"data/07_frameworks/framework_digest.md \u00a7 Minimum ambition (V1.3.1 method appendix).** Scope 1+2: 4.2 %/yr linear (1.5 C)."},{"title":"FLAG.** Mandatory for food production and food & beverage processing companies, and for","text":"* **FLAG.** Mandatory for food production and food & beverage processing companies, and for\n  any company whose FLAG emissions exceed 20 % of the total.  Requires a commitment to eliminate\n  deforestation, with a cut-off date no later than 2020 and a target date for full compliance\n  (originally end-2025 in v1.0; check v1.2 for current phase-in rules).  FLAG = land-based emissions and removals:\n  on-farm N2O and CH4, drained organic soils, liming, land-use change, soil carbon.  Fertiliser\n  manufacturing, farm diesel and processing are non-FLAG.","evidence":"data/07_frameworks/framework_digest.md \u00a7 FLAG.** Mandatory for food production and food & beverage processing companies, and for"},{"title":"Corporate Standard / Scope 3 Standard.** Base-year recalculation after structural changes","text":"* **Corporate Standard / Scope 3 Standard.** Base-year recalculation after structural changes\n  (acquisitions, divestments) and methodology changes above a significance threshold.","evidence":"data/07_frameworks/framework_digest.md \u00a7 Corporate Standard / Scope 3 Standard.** Base-year recalculation after structural changes"},{"title":"Scope 2.** Report both location-based (grid average) and market-based (contractual","text":"* **Scope 2.** Report both location-based (grid average) and market-based (contractual\n  instruments such as guarantees of origin, else residual mix).  A revised Scope 2 / Scope 3\n  consultation is planned for 2027.","evidence":"data/07_frameworks/framework_digest.md \u00a7 Scope 2.** Report both location-based (grid average) and market-based (contractual"},{"title":"Land Sector and Removals Standard (LSR).** v1.0 January 2026, v1.1 June 2026, effective","text":"* **Land Sector and Removals Standard (LSR).** v1.0 January 2026, v1.1 June 2026, effective\n  1 January 2027.  Covers land management emissions, land-use change, removals (optional to\n  report; must be monitored, traceable and reversals accounted for) and biogenic products.","evidence":"data/07_frameworks/framework_digest.md \u00a7 Land Sector and Removals Standard (LSR).** v1.0 January 2026, v1.1 June 2026, effective"},{"title":"SBTN.** Steps: 1 assess (1a materiality screening on ENCORE pressures, 1b value-chain","text":"* **SBTN.** Steps: 1 assess (1a materiality screening on ENCORE pressures, 1b value-chain\n  assessment), 2 interpret & prioritise (pressure x state of nature), 3 measure, set and\n  disclose targets (freshwater quantity and quality, land), 4 act, 5 track.  SBTN 2.0 was\n  launched in October 2026 (adds groundwater and pesticides; supplier-engagement targets);\n  V1 methods valid for validation until April 2027.","evidence":"data/07_frameworks/framework_digest.md \u00a7 SBTN.** Steps: 1 assess (1a materiality screening on ENCORE pressures, 1b value-chain"},{"title":"Freshwater quality.** Nutrient targets focus on the limiting nutrient (often phosphorus in","text":"* **Freshwater quality.** Nutrient targets focus on the limiting nutrient (often phosphorus in\n  Finnish lakes) at sub-basin level; state-of-nature water layers combine Aqueduct and nutrient\n  models.","evidence":"data/07_frameworks/framework_digest.md \u00a7 Freshwater quality.** Nutrient targets focus on the limiting nutrient (often phosphorus in"},{"title":"TNFD LEAP 2.0** (October 2026): Locate - Evaluate - Assess - Prepare.","text":"* **TNFD LEAP 2.0** (October 2026): Locate - Evaluate - Assess - Prepare.","evidence":"data/07_frameworks/framework_digest.md \u00a7 TNFD LEAP 2.0** (October 2026): Locate - Evaluate - Assess - Prepare."},{"title":"ESRS (revised, 2026).**  E1 climate (transition plan, scenario analysis, targets, energy,","text":"* **ESRS (revised, 2026).**  E1 climate (transition plan, scenario analysis, targets, energy,\n  gross Scope 1/2/3, biogenic CO2 separately, removals), E3 water (consumption in areas of water\n  stress = Aqueduct baseline water stress \"high\" or above, or WEI+ >= 40 %), E4 biodiversity.\n  After the 2026 Omnibus, CSRD scope is > 1,000 employees and > EUR 450 m turnover, so Apetit\n  is expected to report voluntarily (e.g. VSME/GRI) rather than under mandatory ESRS.","evidence":"data/07_frameworks/framework_digest.md \u00a7 ESRS (revised, 2026).**  E1 climate (transition plan, scenario analysis, targets, energy,"},{"title":"EU Deforestation Regulation.** Applies from 30 December 2026 (large and medium operators).","text":"* **EU Deforestation Regulation.** Applies from 30 December 2026 (large and medium operators).\n  Relevant commodities: cattle, cocoa, coffee, palm oil, rubber, soya, wood - but scope is set\n  product by product by the HS codes in Annex I (e.g. soya: 1201 beans, 1507 oil, 2304 meal).\n  Soy protein isolate (HS 3504) is not listed, and rapeseed is not a relevant commodity.  Annex I\n  can be amended by delegated act, so screen HS codes, not commodity names.","evidence":"data/07_frameworks/framework_digest.md \u00a7 EU Deforestation Regulation.** Applies from 30 December 2026 (large and medium operators)."},{"title":"EU ETS2.** Carbon pricing of fuels for buildings, road transport and small industry; start","text":"* **EU ETS2.** Carbon pricing of fuels for buildings, road transport and small industry; start\n  postponed to 2028.  Relevant for LNG/LPG/diesel cost pathways.","evidence":"data/07_frameworks/framework_digest.md \u00a7 EU ETS2.** Carbon pricing of fuels for buildings, road transport and small industry; start"},{"title":"CBAM.** Definitive phase from 2026 covers fertilisers -> input-cost risk for growers.","text":"* **CBAM.** Definitive phase from 2026 covers fertilisers -> input-cost risk for growers.","evidence":"data/07_frameworks/framework_digest.md \u00a7 CBAM.** Definitive phase from 2026 covers fertilisers -> input-cost risk for growers."},{"title":"NGFS Phase V** (November 2024; usability notes November 2025): Net Zero 2050, Below 2 C,","text":"* **NGFS Phase V** (November 2024; usability notes November 2025): Net Zero 2050, Below 2 C,\n  Low Demand, Delayed Transition, Fragmented World, NDCs, Current Policies.  This dataset ships\n  illustrative carbon-price paths in the NGFS ranges; pull official values from the IIASA NGFS\n  explorer (variable Price|Carbon) for production use.","evidence":"data/07_frameworks/framework_digest.md \u00a7 NGFS Phase V** (November 2024; usability notes November 2025): Net Zero 2050, Below 2 C,"},{"title":"Physical climate (Finland).** FMI CMIP6 projections (Ruosteenoja & Jylh\u00e4 2021): by","text":"* **Physical climate (Finland).** FMI CMIP6 projections (Ruosteenoja & Jylh\u00e4 2021): by\n  2040-2069 vs 1981-2010, Finland warms +2.3 / +2.7 / +3.6 C (SSP1-2.6 / 2-4.5 / 5-8.5), summer\n  +2.1 / +2.4 / +3.2 C; summer precipitation in the south changes little, so early-summer\n  drought risk increases with higher evaporation; heavy-rain intensity increases.","evidence":"data/07_frameworks/framework_digest.md \u00a7 Physical climate (Finland).** FMI CMIP6 projections (Ruosteenoja & Jylh\u00e4 2021): by"},{"title":"Methodology: how the \"truth\" is calculated","text":"# Methodology: how the \"truth\" is calculated\n\nThis is the canonical method behind the hidden answer keys. `tools/ccn_tools/reference_calculator.py`\nimplements the same method. Clean input gives the right answer; raw input passes every\ndata-quality problem straight through.\n\nStandards: GHG Protocol Corporate Standard, Scope 2 Guidance and Scope 3 Standard; IPCC AR6\nGWP100 (N2O 273, fossil CH4 29.8); IPCC 2019 Refinement for agricultural N2O.","evidence":"docs/METHODOLOGY.md \u00a7 Methodology: how the \"truth\" is calculated"},{"title":"Grain trade, divested 31 May 2022.** It appears in the published history (`05_scenarios/pu","text":"* **Grain trade, divested 31 May 2022.** It appears in the published history (`05_scenarios/published_inventory_history.csv`) but is not in the activity data and is outside the canonical 2021\u20132025 inventory. That inventory covers continuing operations only, so base-year recalculation is part of task B.","evidence":"docs/METHODOLOGY.md \u00a7 Grain trade, divested 31 May 2022.** It appears in the published history (`05_scenarios/pu"},{"title":"Foodhills (Bjuv, Sweden), acquired 27 Nov 2025.","text":"* **Foodhills (Bjuv, Sweden), acquired 27 Nov 2025.**\n  * Its own operations are included from December 2025.\n  * Its pea growers delivered before the acquisition, so Swedish farm emissions are **not** in the 2025 inventory. They are in full from 2026.\n  * Because of the acquisition, a base-year recalculation is needed.","evidence":"docs/METHODOLOGY.md \u00a7 Foodhills (Bjuv, Sweden), acquired 27 Nov 2025."},{"title":"Pudasj\u00e4rvi (closure decided 2026) and the sale of the Kantvik biosteam plant (closing earl","text":"* **Pudasj\u00e4rvi (closure decided 2026) and the sale of the Kantvik biosteam plant (closing early 2027)** are future structural changes. They belong in pathway modelling (task B), not in the 2025 inventory.","evidence":"docs/METHODOLOGY.md \u00a7 Pudasj\u00e4rvi (closure decided 2026) and the sale of the Kantvik biosteam plant (closing earl"},{"title":"2. Canonical tables (input to the reference calculator)","text":"## 2. Canonical tables (input to the reference calculator)\n\n| Table | Key columns | Notes |\n|---|---|---|\n| `energy` | site_id, year, carrier, mwh | Fuels in MWh (NCV). Fuel deliveries are converted with: LNG 13.5 MWh/t, LPG 12.8 MWh/t, light fuel oil 0.0100 MWh/l, diesel 0.0099 MWh/l. Consumption = deliveries \u2212 stock change. |\n| `refrigerants` | site_id, year, refrigerant, kg_added | Top-up mass equals emitted mass (mass-balance simplification). |\n| `goo` | site_id, year, mwh_cancelled, vintage_year | Counts for year Y only if vintage_year = Y. Volume is capped at the site's consumption. `goo_cancellations.csv` is an internal manual log; `goo_registry_statement.csv`, the national registry export, is authoritative. The leased head office has no GoO coverage (landlord contract). |\n| `heat_suppliers` | site_id, year, t_per_mwh | Supplier-specific factor for market-based purchased steam/heat. |\n| `purchases` | year, material_id, supplier_id, qty_kg, amount_eur | Credit notes (movement 122) are legitimate and net against receipts. |\n| `pcf_used` | year, supplier_id, material_id, kgco2e_per_kg | Valid supplier PCFs only (see \u00a74). |\n| `farm_footprints` | farm_id, crop, year, region, tco2e | Contract-farm emissions allocated to delivered kg (\u00a75). |\n| `shipments` | year, direction, ef_id, tkm | Inbound legs give category 4; outbound legs give category 9. |\n| `warehousing` | year, palle","evidence":"docs/METHODOLOGY.md \u00a7 2. Canonical tables (input to the reference calculator)"},{"title":"Combustion:** MWh \u00d7 fossil CO2 factor (t/MWh): LNG 0.1991, natural gas 0.2009, LPG 0.2336,","text":"* **Combustion:** MWh \u00d7 fossil CO2 factor (t/MWh): LNG 0.1991, natural gas 0.2009, LPG 0.2336, light fuel oil 0.2668, diesel (Finnish average bio-blend) 0.2110. Sources: Statistics Finland fuel classification 2025, converted from t/TJ.","evidence":"docs/METHODOLOGY.md \u00a7 Combustion:** MWh \u00d7 fossil CO2 factor (t/MWh): LNG 0.1991, natural gas 0.2009, LPG 0.2336,"},{"title":"Biogenic CO2:","text":"* **Biogenic CO2:**\n  * It is reported separately as a memo item, not in Scope 1.\n  * Factors: wood chips 0.4032, oilseed side streams 0.45, biogas 0.198, plus the bio share of diesel.","evidence":"docs/METHODOLOGY.md \u00a7 Biogenic CO2:"},{"title":"Refrigerants:** kg \u00d7 GWP100 (AR6). The gas codes are R717 ammonia (GWP 0), R744 CO2 (1), R","text":"* **Refrigerants:** kg \u00d7 GWP100 (AR6). The gas codes are R717 ammonia (GWP 0), R744 CO2 (1), R404A (4,728), R449A (1,504), R134a (1,530) and R410A (2,256). Ammonia is not a greenhouse gas: a leak is a safety issue, not a CO2e issue.","evidence":"docs/METHODOLOGY.md \u00a7 Refrigerants:** kg \u00d7 GWP100 (AR6). The gas codes are R717 ammonia (GWP 0), R744 CO2 (1), R"},{"title":"Scope 2, location-based:","text":"* **Scope 2, location-based:**\n  * Electricity: MWh \u00d7 national production factor. Finland 2019\u20132025 (kg/kWh): 0.090, 0.068, 0.075, 0.066, 0.038, 0.030, 0.026. Sweden: 0.012.\n  * Purchased heat: MWh \u00d7 national district-heat average.","evidence":"docs/METHODOLOGY.md \u00a7 Scope 2, location-based:"},{"title":"Scope 2, market-based:","text":"* **Scope 2, market-based:**\n  * Electricity: (MWh \u2212 valid GoO MWh) \u00d7 residual mix. Finland, from AIB: 0.406 in 2024, with a design value for 2025. Sweden: 0.035.\n  * Purchased heat: MWh \u00d7 supplier-specific factor.","evidence":"docs/METHODOLOGY.md \u00a7 Scope 2, market-based:"},{"title":"4. Scope 3","text":"## 4. Scope 3\n\n| Category | Method |\n|---|---|\n| 1 Goods | kg \u00d7 factor. Hierarchy: (1) valid supplier PCF, (2) material default factor from `emission_factor_library.csv`. Contract farming: farm-specific footprints (\u00a75). |\n| 1 Services | Spend (EUR) \u00d7 EEIO-style factor. |\n| 2 Capital goods | Capex spend \u00d7 EEIO-style factor (no depreciation). |\n| 3 Fuel & energy | Fuel MWh \u00d7 well-to-tank factor + electricity MWh \u00d7 upstream & T&D factor + purchased heat \u00d7 upstream factor. |\n| 4 Upstream transport | Inbound tkm \u00d7 WTW factor per mode (GLEC-style). Every import lot has a road leg plus a sea or Ro-Pax leg where relevant. |\n| 5 Waste | t \u00d7 treatment factor; third-party wastewater m3 \u00d7 factor. Spent bleaching earth goes to co-digestion/landfill. |\n| 6 Business travel | Flight and rail pkm \u00d7 factor + hotel nights. |\n| 7 Commuting | 2025 survey: mean annual kg per respondent \u00d7 site headcount. |\n| 9 Downstream transport | Outbound tkm (reefer for frozen goods) + third-party frozen warehousing pallet-days. |\n| 11 Use of sold products | Indirect use phase: consumer freezer storage (~45 days) plus cooking energy (kWh/kg by product group) \u00d7 grid factor of the market where the product is sold. Apetit's sample reports 6,708 t; the location-based grid choice here gives a much lower figure. That is a method choice to discuss, not an error. |\n| 12 End of life | Packaging put on market (kg/t by prod","evidence":"docs/METHODOLOGY.md \u00a7 4. Scope 3"},{"title":"5. Contract-farm footprint (cradle to farm gate, per hectare)","text":"## 5. Contract-farm footprint (cradle to farm gate, per hectare)\n\n| Source | Formula |\n|---|---|\n| Fertiliser manufacture | N \u00d7 3.7 kg CO2e/kg N (AN, Yara verified \u2248 3.73), or 0.9 for low-carbon AN; P \u00d7 1.6; K (= 2.2 \u00d7 P) \u00d7 0.5 |\n| Direct N2O (FLAG) | (N_mineral \u00d7 0.016 + (N_manure + N_residues) \u00d7 0.006) \u00d7 44/28 \u00d7 273 (IPCC 2019 wet climate) |\n| Indirect N2O (FLAG) | [(N_min \u00d7 0.05 + N_man \u00d7 0.21) \u00d7 0.014 + (N_min + N_man + N_res) \u00d7 0.24 \u00d7 0.011] \u00d7 44/28 \u00d7 273 |\n| Diesel | litres \u00d7 (2.10 Finnish average blend or 2.45 Swedish, combustion + 0.61 WTT) |\n| Liming (FLAG) | t \u00d7 0.44 t CO2/t |\n| Drained organic soils (FLAG) | 29.0 t CO2/ha/yr for annual crops (20.9 for grass) + 13 kg N2O-N/ha/yr (Finnish GHG inventory; IPCC Wetlands Supplement) |\n| Pesticides | 8 kg CO2e per spray pass |\n| Electricity | Storage/drying kWh/t \u00d7 yield + 180 kWh/ha if irrigated, \u00d7 grid factor |\n\n* Residue N per tonne of product is given in `tools/ccn_tools/factors.py` (`RESIDUE_N_PER_T`). Biological N fixation by peas is not an N input.","evidence":"docs/METHODOLOGY.md \u00a7 5. Contract-farm footprint (cradle to farm gate, per hectare)"},{"title":"Allocation:** farm emissions for the crop are divided by delivered kg. Intake rejections s","text":"* **Allocation:** farm emissions for the crop are divided by delivered kg. Intake rejections stay with the delivered product.","evidence":"docs/METHODOLOGY.md \u00a7 Allocation:** farm emissions for the crop are divided by delivered kg. Intake rejections s"},{"title":"FLAG (SBTi) part:** direct and indirect N2O, organic soils and liming. Fertiliser manufact","text":"* **FLAG (SBTi) part:** direct and indirect N2O, organic soils and liming. Fertiliser manufacture, diesel, electricity and pesticides are non-FLAG.","evidence":"docs/METHODOLOGY.md \u00a7 FLAG (SBTi) part:** direct and indirect N2O, organic soils and liming. Fertiliser manufact"},{"title":"FLAG share of purchased commodities:** each library factor carries a `flag_share`.","text":"* **FLAG share of purchased commodities:** each library factor carries a `flag_share`.","evidence":"docs/METHODOLOGY.md \u00a7 FLAG share of purchased commodities:** each library factor carries a `flag_share`."},{"title":"Organic soils are included.** Finnish cropland is about 11 % organic soils nationally (Luk","text":"* **Organic soils are included.** Finnish cropland is about 11 % organic soils nationally (Luke) and less in south-west Finland. The `current_calculator_footprints.csv` file reproduces the current practice, which assumes mineral soil and excludes these emissions, so teams can compare the two.","evidence":"docs/METHODOLOGY.md \u00a7 Organic soils are included.** Finnish cropland is about 11 % organic soils nationally (Luk"},{"title":"6. Weather, yields and nature (simulation, not accounting)","text":"## 6. Weather, yields and nature (simulation, not accounting)\n\nThe generators behind the weather, crop yields and nutrient losses are described in SIMULATION_DESIGN.md.\nThe SBTN-style prioritisation formula used in task D1 is in NATURE_SBTN.md.","evidence":"docs/METHODOLOGY.md \u00a7 6. Weather, yields and nature (simulation, not accounting)"},{"title":"Nature: SBTN-style assessment","text":"# Nature: SBTN-style assessment\n\nThe brief asks for a system that combines emissions, raw-material and geospatial data to\nprioritise nature-related impacts and dependencies, such as biodiversity, eutrophication and\nwater availability. It also asks that the system be built so geospatial data can be added later.","evidence":"docs/NATURE_SBTN.md \u00a7 Nature: SBTN-style assessment"},{"title":"Data","text":"## Data\n\n| File | Content |\n|---|---|\n| `06_nature/parcels.geojson`, `01_master/parcels.csv` | Synthetic parcels with farm, soil class (soil map, ~88 % accurate), clay %, slope, distance to water, drainage, latest soil-P test (18 % missing), buffer strip and catchment |\n| `03_farming/parcel_crop_history_and_plan.csv` | Crop and catch crop per parcel and year, 2012\u20132026, plus the 2027\u20132031 plan |\n| `06_nature/catchments.geojson`, `catchments.csv` | Catchment polygons; receiving-water type; ecological status class; retention estimate; P sensitivity; total field area |\n| `06_nature/monitored_catchment_loads.csv` | Outlet P and N loads at 15 stations, 2019\u20132025 (\u00b110\u201315 %). These include non-contract farmland and natural background. |\n| `06_nature/origin_state_of_nature_indicative.csv` | Indicative state-of-nature categories for import origins (water stress, deforestation/conversion risk, biodiversity sensitivity, nutrient status) |\n\nThe geometries are synthetic. The coordinates are placed in the real sourcing regions, so the same\npipeline will run on real layers:","evidence":"docs/NATURE_SBTN.md \u00a7 Data"},{"title":"Finland:** Finnish Food Authority field parcels; SYKE catchments, Corine land cover and Na","text":"* **Finland:** Finnish Food Authority field parcels; SYKE catchments, Corine land cover and Natura 2000 (CC BY 4.0).","evidence":"docs/NATURE_SBTN.md \u00a7 Finland:** Finnish Food Authority field parcels; SYKE catchments, Corine land cover and Na"},{"title":"Imports:** WRI Aqueduct 4.0 (CC BY 4.0) and GFW tree-cover loss (CC BY 4.0).","text":"* **Imports:** WRI Aqueduct 4.0 (CC BY 4.0) and GFW tree-cover loss (CC BY 4.0).","evidence":"docs/NATURE_SBTN.md \u00a7 Imports:** WRI Aqueduct 4.0 (CC BY 4.0) and GFW tree-cover loss (CC BY 4.0)."},{"title":"Not redistributed, because of their licences:** EXIOBASE, the NHM Biodiversity Intactness ","text":"* **Not redistributed, because of their licences:** EXIOBASE, the NHM Biodiversity Intactness Index and IBAT/KBA data.","evidence":"docs/NATURE_SBTN.md \u00a7 Not redistributed, because of their licences:** EXIOBASE, the NHM Biodiversity Intactness "},{"title":"Mapping to SBTN steps","text":"## Mapping to SBTN steps\n\n| SBTN step | In this dataset |\n|---|---|\n| 1a Materiality screening (ENCORE pressures) | Materials and commodities \u00d7 pressure categories: land use, water use, nutrient pollution, GHG, pesticides. Note: soy is on SBTN's High Impact Commodity List, and dairy and meat come from cattle. |\n| 1b Value-chain assessment | Volumes by origin from ERP, contract parcels, FLAG emissions |\n| 2 Interpret and prioritise | **Task D1**: pressure \u00d7 state of nature at catchment level |\n| 3 Targets | Freshwater quality: the limiting nutrient in Finnish lakes is often phosphorus. Land: organic soils and land conversion. |\n| 4\u20135 Act and track | Levers L09\u2013L12 and L24; monitoring stations |","evidence":"docs/NATURE_SBTN.md \u00a7 Mapping to SBTN steps"},{"title":"D1 priority formula","text":"## D1 priority formula\n\n`priority = (P / median(P) + 0.5 \u00d7 N / median(N)) \u00d7 state_weight \u00d7 p_sensitivity`","evidence":"docs/NATURE_SBTN.md \u00a7 D1 priority formula"},{"title":"P and N:** the phosphorus and nitrogen that Apetit-contract parcels deliver to receiving w","text":"* **P and N:** the phosphorus and nitrogen that Apetit-contract parcels deliver to receiving water in 2025 (kg/yr), after delivery from field to water and catchment retention.","evidence":"docs/NATURE_SBTN.md \u00a7 P and N:** the phosphorus and nitrogen that Apetit-contract parcels deliver to receiving w"},{"title":"state_weight:** good 1.0, moderate 1.2, poor 1.5, bad 1.8.","text":"* **state_weight:** good 1.0, moderate 1.2, poor 1.5, bad 1.8.","evidence":"docs/NATURE_SBTN.md \u00a7 state_weight:** good 1.0, moderate 1.2, poor 1.5, bad 1.8."},{"title":"p_sensitivity:** from `catchments.csv`. It is high for a clear lake in good status that is","text":"* **p_sensitivity:** from `catchments.csv`. It is high for a clear lake in good status that is under protection, because preventing deterioration counts as much as restoring a degraded lake.\n\nThe hidden part is the *true* load. Estimate it from parcel attributes, crops, fertilisation, weather\nand the monitored outlet loads. The ranking logic itself is public.","evidence":"docs/NATURE_SBTN.md \u00a7 p_sensitivity:** from `catchments.csv`. It is high for a clear lake in good status that is"},{"title":"Files","text":"## Files\n\n| File | What it is |\n|---|---|\n| `05_scenarios/transition_scenarios.csv` | Seven NGFS Phase V scenario names. Illustrative EU carbon price, ETS2 fuel price (from 2028), electricity price, N-fertiliser and diesel price indices, plant-based demand index, import premium. Each is mapped to a physical proxy (SSP). |\n| `05_scenarios/structural_events.csv` | Divestments, acquisitions, plant changes and regulatory dates, with their inventory relevance. |\n| `05_scenarios/decarbonisation_levers.csv` | 30 levers with indicative abatement, capex, opex, lifetime, start year, ramp, confidence, co-benefits and trade-offs. Abatement figures are design estimates: recompute them from your inventory. |\n| `05_scenarios/contract_prices_and_replacement_premiums.csv` | Farm-gate contract prices 2018\u20132026 and the premium for replacing a shortfall with imports. |\n| `05_scenarios/published_inventory_history.csv` | Apetit's published totals 2019\u20132024, including restatements. |\n| `04_climate/weather_daily_1991_2060.parquet` | Daily weather per grid cell. `scenario` = historical (1991\u20132026), ssp126 / ssp245 / ssp585 (2027\u20132060). |\n| `04_climate/climate_change_signals.csv` | Monthly deltas (2041\u20132060 vs 1991\u20132020), for delta-method approaches. |\n\nThe carbon-price paths are **illustrative values in NGFS ranges**. Replace them with official NGFS data\n(IIASA explorer, `Price|Carbon`) before using th","evidence":"docs/SCENARIOS_AND_RISK.md \u00a7 Files"},{"title":"Track B: what a strong answer contains","text":"## Track B: what a strong answer contains\n\n1. **Base year.** SBTi V2 prefers the latest year with comprehensive data. The 2025 inventory is complete, but 2025 still needs a structural adjustment for Foodhills, because only December is in scope. Show both options: a recalculated 2019 base and a 2025 base.\n2. **FLAG split.** Use the `flag_share` of factors and the FLAG components of contract farming. Apetit must set a FLAG target as a food processor.\n3. **Targets.**\n   * Scope 1+2: \u2265 4.2 %/yr linear.\n   * Scope 3 non-FLAG: \u2265 2.5 %/yr (well-below 2 \u00b0C).\n   * FLAG: \u2265 3.03 %/yr.\n   * Coverage rules: near-term Scope 3 targets must cover the relevant categories (V2: every category \u2265 5 % of Scope 3).\n4. **Pathway.** BAU drivers (volumes, structural events, grid decarbonisation) plus levers by start year and ramp, under at least two transition scenarios. Show the gap to target per year.\n5. **MACC.** Cost per t, including co-benefits for water, nutrients and biodiversity. Separate structural changes and measurement changes from real abatement.\n6. **Traceability.** Every pathway number links back to inventory lines and lever assumptions.","evidence":"docs/SCENARIOS_AND_RISK.md \u00a7 Track B: what a strong answer contains"},{"title":"Track C: climate risk to farming","text":"## Track C: climate risk to farming\n\n* The truth yield model reacts to:\n  * drought in sensitive stages, mitigated by irrigation;\n  * heat days at flowering;\n  * waterlogging after sowing on clay;\n  * rain at harvest;\n  * season length;\n  * potato late blight;\n  * pollen beetle in turnip rape.\n* Learn these responses from the 2012\u20132026 history (farm survey yields, deliveries in ERP, the Foodhills file) and the daily weather. Then:\n  * **C1:** predict the 2027\u20132031 seasons, for which weather is given and yields are hidden.\n  * **C2:** estimate 2041\u20132060 risk under each SSP.\n  * **C3:** price it, for example as shortfall volume \u00d7 contract price \u00d7 replacement premium, plus the emission impact of replacement imports and the value of adaptation such as irrigation, sowing date, varieties or a wider sourcing area.","evidence":"docs/SCENARIOS_AND_RISK.md \u00a7 Track C: climate risk to farming"},{"title":"Known 2026 contrast:** a record Finnish pea harvest and heat- and drought-hit Swedish peas","text":"* **Known 2026 contrast:** a record Finnish pea harvest and heat- and drought-hit Swedish peas. Sourcing from two regions is a hedge; quantify it.","evidence":"docs/SCENARIOS_AND_RISK.md \u00a7 Known 2026 contrast:** a record Finnish pea harvest and heat- and drought-hit Swedish peas"}],"actions":[{"title":"Replace the 'mineral soil' default in the farm calculator with parcel soil data","why":"Drained organic soils are 15,774 t = 59 % of Finnish contract-farm emissions; pea footprint is 1.04 not 0.17 kg CO2e/kg. 27 farms have \u226530 % of contract area on organic soil; 17 survey answers routed for farmer confirmation.","owner":"Sustainability + contract-farming field team","size":"~15,774 tCO2e correction; enables lever L11 (7,887 t/yr at ~\u20ac11/t)","evidence":"A/farm_footprints_2025.csv, A/organic_soil_impact.csv"},{"title":"Set the SBTi base year to 2025 adjusted for a full year of Foodhills; include a FLAG target","why":"FLAG is 70 % of total emissions, so a FLAG target is mandatory (food processor). Base: S1+2 5,819 t, FLAG 164,299 t, S3 non-FLAG 67,857 t. 2019 base needs grain-trade estimates and has no FLAG split.","owner":"Head of sustainability \u2192 SBTi submission (deadline Dec 2027, V1.3.1 or V2)","size":"2030 targets: S1+2 \u221221 %, S3 \u221212.5 %, FLAG \u221215 % vs 2025","evidence":"B/b_results.json, B/targets.csv"},{"title":"Rapeseed supplier programme: primary PCFs + low-carbon fertiliser + origin optimisation (L13, L14)","why":"Imported rapeseed is 122,743 t CO2e (~54 % of Scope 3, ~86 % FLAG). L13+L14 \u2248 22,094 t/yr at \u20ac31\u201352/t \u2014 the cheapest large block in the MACC. Reject the 8 invalid supplier PCFs and request re-issue.","owner":"Procurement (oilseeds) + Kantvik","size":"22,094 tCO2e/yr","evidence":"B/levers_recomputed.csv, A/corrections_log.csv (pcf_*)"},{"title":"S\u00e4kyl\u00e4 biogas security + Bjuv gas-to-biogas + R404A replacement (L01, L07, L03)","why":"Together 4,054 t/yr \u2014 enough to meet the Scope 1+2 2030 target in every scenario; ETS2 fuel prices from 2028 make L01/L07 cheaper.","owner":"Operations / energy manager","size":"S1+2 \u2192 ~1,300 t by 2030","evidence":"B/pathways.csv, lines_long S-SAK:lng/lpg, S-BJU:natural_gas, R404A"},{"title":"Nutrient programme in the 5 priority catchments (CA12, CA24, CA14, CS07, CA06)","why":"Contract parcels deliver 7.6 t P / 91 t N to water. Buffer strips, catch crops, gypsum and P draw-down on the top-50 hotspot parcels avoid ~0.55 t P/yr for ~\u20ac61 k/yr; cheapest at \u20ac38\u201370/kg P.","owner":"Contract-farming agronomists + growers","size":"\u221243\u201352 % contract P in top-5 catchments","evidence":"D/hotspots_top50.csv, D/catchment_programme_top5.csv"},{"title":"Keep two-country pea sourcing and expand irrigation/sowing-date advice as climate hedge","why":"Weather risk is already here: Finnish pea falls below 80 % of a normal crop in ~1 year in 7 (13.6 %), turnip rape ~1 in 13. Expected shortfall cost across contract crops is ~\u20ac0.46 m/yr today (1-in-10 year ~\u20ac1.5 m) plus ~2 kt CO2e from replacement imports; to 2041\u201360 the climate signal shifts this only modestly (SSP5-8.5: SE pea bad years 4.7 \u2192 6.5 %, potato cost +31 %). FI and SE pea yields are weakly correlated (2026: FI +24 %, SE \u22128.5 %), so two-country sourcing is the cheapest hedge; heat-tolerant varieties pay back; irrigating Swedish peas does not.","owner":"Contract farming + supply planning","size":"\u221244 % expected pea shortfall cost today, \u221272 % under SSP2-4.5; irrigating potato+carrot \u2248 +\u20ac350 k/yr net","evidence":"C/c3_euro_risk.csv, C/c3_adaptation.csv"},{"title":"Block publication of the draft 2025 summary","why":"It reports Scope 3 = 71,534,593 t vs 228,011 t cleaned: kWh read as MWh, t keyed as kg, refrigerant g as kg. Its total does not add up (total_mismatch).","owner":"Reporting / controller","size":"prevents a ~300\u00d7 misstatement","evidence":"data/05_scenarios/draft_report_summary_2025.csv; A1 report:2025:*"}],"scores":[{"task":"A1 data-quality issues","ours":"96.0 (F1 0.960)","baseline":"52.2","how":"2023\u201324 dev labels, ccn_tools.score_a1"},{"task":"A2 inventory 2023","ours":"95.9","baseline":"25.5","how":"public 2023 truth"},{"task":"A2 inventory 2024","ours":"96.6","baseline":"23.2","how":"public 2024 truth"},{"task":"D1 catchment loads & rank","ours":"76.7 (LOO 73.5)","baseline":"12.0","how":"6 dev catchments; leave-one-out = honest"},{"task":"C1 yields 2027\u201331","ours":"MAPE 6.8 % / nRMSE 0.136","baseline":"MAPE ~11.6 % (farm mean)","how":"leave-years-out backtest on 2012\u20132026 history, C1 metric"},{"task":"E dev numeric","ours":"3/3 within tolerance","baseline":"\u2013","how":"E90\u2013E92 dev answers"}],"stack":[{"layer":"Storage","now":"CSV/Parquet + pickled canonical tables","prod":"Fabric Lakehouse: bronze (raw feeds) \u2192 silver (clean canonical, Delta) \u2192 gold (inventory lines, KPIs)"},{"layer":"DQ agent","now":"Python detectors (dq_agent.py), confidence + explanation","prod":"Fabric notebooks + Azure AI Foundry agent; issue log as Delta table"},{"layer":"Calculation","now":"ccn_tools.reference_calculator on cleaned tables","prod":"Versioned calculation notebook; governed factor library table"},{"layer":"Models","now":"scikit-learn yield models, export-coefficient nutrient model","prod":"Azure ML / Fabric Data Science, MLflow registry"},{"layer":"Copilot / RAG","now":"in-browser BM25 retrieval + optional OpenAI-compatible LLM","prod":"Azure AI Search over framework PDFs + Azure OpenAI in AI Foundry; Copilot Studio front-end"},{"layer":"Review & approval","now":"this app: per-module approval + issue decisions, JSON audit log","prod":"Power Apps approval flow; decisions written back to Lakehouse"},{"layer":"Geospatial","now":"GeoJSON parcels/catchments, SVG maps","prod":"GeoParquet in Fabric + Azure Maps; SYKE & Ruokavirasto layers"}],"assumptions":["All data is synthetic (Since AI package v1.0.0); results illustrate the method, not Apetit's real emissions.","Soil-map organic recall factor 1.17 calibrated on 2023\u201324 truths; to be replaced by Apetit's parcel register (flagged for review).","Estimated meter months scaled to GoO volumes where the gap-fill overshoots by <10 % (goo_reconciliation_log.csv).","Foodhills full-year adjustment: Bjuv NG 7,300 MWh/yr (lever L07 note); SE grower emissions computed from the Foodhills file assuming mineral soil.","Pudasj\u00e4rvi contract manufacturing assumed to emit as much in cat 1 as the plant did in S1+S2 (location-based).","Kantvik purchased biosteam assumed at 0.02 t/MWh supplier factor after 2027 \u2014 verify the supplier-specific factor and GoO.","Lever costs: capex annualised at 6 % over lifetime + opex delta; ETS2 fuel price credited to fuel levers; uncertainty \u00b120/40/60 % by confidence.","Carbon-price paths are illustrative NGFS-range values; replace with IIASA NGFS Price|Carbon before decisions.","Nutrient model is an export-coefficient model fitted to 6 dev catchments (\u00b110 % expected error); not VEMALA.","Climate projections use one realisation per SSP plus perturbation; no CO2 fertilisation; management and technology frozen at 2025.","Measure costs for nutrient actions are indicative (agri-environment payment levels)."],"value":{"points":[{"big":"314\u00d7","small":"misstatement caught before publication","title":"Stops wrong numbers reaching the report","text":"The DQ agent found 133 issues in 2025 and scores 96/100 on the public answer key (baseline 52). Unit slips, duplicate postings, GoO-registry conflicts and invalid supplier PCFs are flagged with evidence and fixed reproducibly.","evidence":"A1 submission; A/corrections_log.csv"},{"big":"15.8 kt","small":"59 % of FI contract-farm emissions were invisible","title":"Finds the emissions you are not counting","text":"Drained organic soils are missing from the current farm calculator. The Navigator counts them parcel by parcel and routes the uncertain cases to the field team, before an SBTi validator or auditor finds them.","evidence":"A/farm_footprints_2025.csv"},{"big":"37 kt/yr","small":"abatement available below \u20ac60/t; 1,590 t of it saves \u20ac154 k/yr","title":"Gets you to an SBTi submission, FLAG included","text":"The base year is recalculated for Foodhills, the FLAG/non-FLAG split is computed, targets follow the SBTi minimum rates, and the lever plan is tested under 7 NGFS scenarios. The submission is due by Dec 2027, and V2 applies from Feb 2027.","evidence":"B/levers_recomputed.csv; B/pathways.csv"},{"big":"\u221272 %","small":"pea shortfall cost from two-country sourcing (SSP2-4.5)","title":"Puts euros on climate risk to farming","text":"Yield models trained on 15 seasons (6.8 % backtest error) and a 40,000-draw Monte Carlo per crop turn SSP scenarios into shortfall t, \u20ac (\u2248\u20ac0.46 m/yr expected, ~\u20ac1.5 m in a 1-in-10 year) and extra import emissions. Irrigating potato and carrot pays back about \u20ac350 k/yr.","evidence":"C/c3_euro_risk.csv; C/c3_hedge_fi_se.csv; C/c3_adaptation.csv"},{"big":"15 %","small":"of contract phosphorus comes from 50 fields","title":"Targets nature action where it matters","text":"SBTN steps 1\u20132 are done at field and catchment level: 7.6 t P reaching water, the top-5 catchments, and measures from \u20ac38/kg P. The same code runs on real SYKE and Ruokavirasto layers.","evidence":"D/hotspots_top50.csv; D/d1_metrics.json"},{"big":"100 %","small":"of numbers traceable, with approval before publication","title":"Audit-ready by design","text":"Bronze \u2192 silver \u2192 gold, every correction logged, nothing overwritten. A named expert approves each module. The whole run reproduces in ~2 minutes and maps 1:1 onto Microsoft Fabric, AI Foundry and Power Apps.","evidence":"METHOD_NOTE.md; run_all.py"},{"big":"0","small":"invented numbers: the AI cites its evidence","title":"An AI copilot the sustainability team can trust","text":"A tool-using agent answers questions in any language from the pipeline's own tables and the framework digest, cites its sources, and drafts the board memo. It says when it has no evidence.","evidence":"AI copilot tab; E answers"},{"big":"1 platform","small":"climate + nature + risk in one model of the value chain","title":"Replaces spreadsheets and consultants' one-off studies","text":"GHG inventory, SBTi pathways, the physical climate risk TCFD/ESRS E1 asks for, and SBTN/TNFD nature screening share one data model. They update when the data updates instead of once a year.","evidence":"app tabs"}],"calendar":[{"date":"30 Dec 2026","what":"EU Deforestation Regulation applies","how":"HS-code screening of purchased materials (D2); soy protein isolate HS 3504 flagged as out of Annex I scope but high-risk"},{"date":"1 Jan 2027","what":"GHG Protocol Land Sector & Removals Standard effective","how":"FLAG components per farm; removals kept out of gross inventory until monitored"},{"date":"early 2027","what":"Kantvik biosteam sale closes","how":"Scope 1 \u2192 Scope 2 shift modelled; supplier-specific steam factor flagged for verification"},{"date":"1 Feb 2027","what":"SBTi CNZS V2 effective (V1.3.1 usable to end-2027)","how":"2025 base with Foodhills adjustment, 5-year targets, \u22655 % category coverage check"},{"date":"Apr 2027","what":"SBTN V1 methods valid for validation until here; SBTN 2.0 thereafter","how":"Steps 1\u20132 at catchment level ready; pesticides/groundwater can be added"},{"date":"Dec 2027","what":"SBTi near-term target submission due (24 months from commitment)","how":"Targets, FLAG and lever plan with an audit trail"},{"date":"2028","what":"EU ETS2 carbon price on fuels","how":"ETS2 price credited to fuel levers in the MACC per NGFS scenario"}]}};
