<script>
"use strict";
// ---------- utilities ----------
const $ = s => document.querySelector(s);
const fmt = (v, d=0) => v==null||isNaN(v) ? "–" : Number(v).toLocaleString("en-US",{maximumFractionDigits:d,minimumFractionDigits:d});
const fmtT = v => fmt(v, Math.abs(v)<100?1:0);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COLORS = ["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)","var(--s6)","var(--s7)","var(--s8)"];
const store = {
  get(k, d){ try{ const v = localStorage.getItem("ccn:"+k); return v==null? d : JSON.parse(v);}catch(e){ return MEM[k]??d; } },
  set(k, v){ MEM[k]=v; try{ localStorage.setItem("ccn:"+k, JSON.stringify(v)); }catch(e){} }
};
const MEM = {};
const tip = $("#tip");
function showTip(e, html){ tip.innerHTML = html; tip.style.display="block"; const x=Math.min(e.clientX+14, innerWidth-360); tip.style.left=x+"px"; tip.style.top=(e.clientY+14)+"px"; }
function hideTip(){ tip.style.display="none"; }
document.addEventListener("mouseover", e => { const t = e.target.closest("[data-tip]"); if(t) showTip(e, t.getAttribute("data-tip")); });
document.addEventListener("mousemove", e => { const t = e.target.closest("[data-tip]"); if(t) showTip(e, t.getAttribute("data-tip")); else hideTip(); });
const src = (txt) => `<span class="src" data-tip="${esc("Source: "+txt)}">src</span>`;
const reviewerName = () => ($("#reviewer").value || store.get("reviewer","")).trim();
$("#reviewer").value = store.get("reviewer","");
$("#reviewer").addEventListener("change", e => store.set("reviewer", e.target.value));

// ---------- audit log & approvals ----------
function audit(action, target, detail){
  const log = store.get("audit", []);
  log.push({ts:new Date().toISOString(), reviewer: reviewerName()||"(anonymous)", action, target, detail});
  store.set("audit", log);
}
async function exportAudit(){
  const payload = { exported: new Date().toISOString(), package: DATA.meta, approvals: store.get("approvals",{}), decisions: store.get("dq_decisions",{}), log: store.get("audit",[]) };
  const txt = JSON.stringify(payload,null,2);
  try{ const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; if(dl){ await dl.save({filename:"ccn_audit_log.json", data:txt}); toast("Audit log saved"); return; } }catch(e){}
  const m = document.createElement("div"); m.id="modal";
  m.innerHTML = `<div style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center" onclick="if(event.target===this)this.parentNode.remove()"><div class="card" style="width:min(820px,92vw)"><div class="row"><b>Audit log (JSON)</b><span style="flex:1"></span><button class="btn pri sm" id="cpy">Copy</button><button class="btn sm" onclick="document.getElementById('modal').remove()">Close</button></div><textarea style="width:100%;height:55vh;margin-top:8px;font-family:var(--mono);font-size:11px" readonly></textarea></div></div>`;
  document.body.appendChild(m); m.querySelector("textarea").value = txt;
  m.querySelector("#cpy").onclick = async () => { try{ await navigator.clipboard.writeText(txt); toast("Copied"); }catch(e){ m.querySelector("textarea").select(); toast("Press Ctrl/Cmd+C to copy"); } };
}
function toast(msg){ const d=document.createElement("div"); d.textContent=msg; d.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:8px;z-index:300;font-size:13px"; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
function reviewBar(module, what){
  const ap = store.get("approvals",{})[module];
  if(ap) return `<div class="reviewbar approved">✅ <b>Approved</b> by ${esc(ap.by)} on ${esc(ap.ts.slice(0,16).replace("T"," "))} — ${esc(what)}. <span class="sp" style="flex:1"></span><button class="btn sm" onclick="unapprove('${module}')">Revoke</button></div>`;
  return `<div class="reviewbar">🟡 <b>Draft — awaiting expert review.</b> ${esc(what)} Results are not published until a named reviewer approves. <span style="flex:1"></span><button class="btn pri sm" onclick="approve('${module}')">Approve for publication</button></div>`;
}
function approve(module){
  const by = reviewerName(); if(!by){ toast("Enter your name in the Reviewer box (top right) first."); $("#reviewer").focus(); return; }
  const a = store.get("approvals",{}); a[module] = {by, ts:new Date().toISOString(), data_version: DATA.meta.generated};
  store.set("approvals", a); audit("approve", module, "module approved"); render();
}
function unapprove(module){ const a = store.get("approvals",{}); delete a[module]; store.set("approvals",a); audit("revoke", module, ""); render(); }

// ---------- charts (plain SVG) ----------
function barH(rows, {label, value, color, width=560, rowH=24, fmtV=fmtT, tipFn}={}){
  const max = Math.max(...rows.map(value), 1e-9); const lw = 210; const w = width - lw - 70;
  const h = rows.length*rowH + 6;
  let s = `<svg class="chart" viewBox="0 0 ${width} ${h}" role="img">`;
  rows.forEach((r,i)=>{
    const v = value(r), bw = Math.max(2, w*Math.max(0,v)/max), y = i*rowH+3;
    const t = tipFn? tipFn(r) : `${esc(label(r))}: ${fmtV(v)}`;
    s += `<g data-tip="${esc(t)}"><rect x="0" y="${y}" width="${width}" height="${rowH}" fill="transparent"/>
      <text x="${lw-8}" y="${y+rowH/2+4}" text-anchor="end">${esc(label(r)).slice(0,34)}</text>
      <rect x="${lw}" y="${y+5}" width="${bw}" height="${rowH-10}" rx="3" fill="${color?color(r,i):'var(--s1)'}"/>
      <text x="${lw+bw+6}" y="${y+rowH/2+4}" style="fill:var(--ink)">${fmtV(v,r)}</text></g>`;
  });
  return s + `</svg>`;
}
function lineChart(series, {width=620, height=260, x0, x1, yMin, yMax, yFmt=fmtT, marks=[] }={}){
  const pad = {l:58,r:110,t:12,b:26};
  const xs = series.flatMap(s=>s.pts.map(p=>p[0])); const ys = series.flatMap(s=>s.pts.map(p=>p[1]));
  x0 = x0??Math.min(...xs); x1 = x1??Math.max(...xs); yMin = yMin??Math.min(0,...ys); yMax = yMax??Math.max(...ys)*1.08;
  const X = v => pad.l + (v-x0)/(x1-x0||1)*(width-pad.l-pad.r), Y = v => height-pad.b - (v-yMin)/(yMax-yMin||1)*(height-pad.t-pad.b);
  let s = `<svg class="chart" viewBox="0 0 ${width} ${height}">`;
  for(let k=0;k<=4;k++){ const v = yMin+(yMax-yMin)*k/4; s += `<g class="grid"><line x1="${pad.l}" x2="${width-pad.r}" y1="${Y(v)}" y2="${Y(v)}"/></g><text x="${pad.l-6}" y="${Y(v)+4}" text-anchor="end">${yFmt(v)}</text>`; }
  const step = Math.ceil((x1-x0)/8)||1; for(let v=x0; v<=x1; v+=step) s += `<text x="${X(v)}" y="${height-8}" text-anchor="middle">${v}</text>`;
  marks.forEach(m=>{ s += `<line x1="${X(m.x)}" x2="${X(m.x)}" y1="${pad.t}" y2="${height-pad.b}" stroke="var(--ink-3)" stroke-dasharray="3 3"/><text x="${X(m.x)+3}" y="${pad.t+10}">${esc(m.label)}</text>`; });
  series.forEach((sr,i)=>{
    const c = sr.color || COLORS[i%8];
    const d = sr.pts.map((p,j)=>(j?"L":"M")+X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join("");
    s += `<path d="${d}" fill="none" stroke="${c}" stroke-width="2" ${sr.dash?'stroke-dasharray="5 4"':''}/>`;
    sr.pts.forEach(p=> s += `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="7" fill="transparent" data-tip="${esc(sr.name+' · '+p[0]+': '+yFmt(p[1]))}"/>`);
    const last = sr.pts[sr.pts.length-1]; if(last) s += `<text x="${X(last[0])+6}" y="${Y(last[1])+4}" style="fill:var(--ink)">${esc(sr.name).slice(0,18)}</text>`;
  });
  return s + `</svg>`;
}
function legend(items){ return `<div class="legend">${items.map((t,i)=>`<span><i style="background:${t.color||COLORS[i%8]}"></i>${esc(t.name)}</span>`).join("")}</div>`; }
function macc(levers, {width=1000, height=320}={}){
  const L = levers.filter(l=>l.abatement>0).slice().sort((a,b)=>a.cost-b.cost);
  const tot = L.reduce((a,l)=>a+l.abatement,0); const cmax = Math.max(...L.map(l=>Math.min(l.cost,600)),50), cmin = Math.min(...L.map(l=>Math.max(l.cost,-600)),0);
  const pad={l:56,r:12,t:12,b:30};
  const X = v => pad.l + v/tot*(width-pad.l-pad.r), Y = v => pad.t + (cmax - v)/(cmax-cmin)*(height-pad.t-pad.b);
  let s = `<svg class="chart" viewBox="0 0 ${width} ${height}">`;
  for(let k=0;k<=4;k++){ const v = cmin+(cmax-cmin)*k/4; s += `<g class="grid"><line x1="${pad.l}" x2="${width-pad.r}" y1="${Y(v)}" y2="${Y(v)}"/></g><text x="${pad.l-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`; }
  s += `<line x1="${pad.l}" x2="${width-pad.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ink-2)"/>`;
  let acc = 0;
  L.forEach(l=>{
    const c = Math.max(Math.min(l.cost,600),-600); const x = X(acc), w = Math.max(1, X(acc+l.abatement)-x-2);
    const y = c>=0? Y(c) : Y(0), h = Math.abs(Y(c)-Y(0));
    const col = l.flag? "var(--s3)" : (l.scope.startsWith("scope1")||l.scope.startsWith("scope2")? "var(--s1)":"var(--s2)");
    s += `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h,1.5)}" rx="2" fill="${col}" data-tip="${esc(`<b>${l.id} ${l.name}</b><br>${fmt(l.abatement)} tCO2e/yr (range ${fmt(l.low)}–${fmt(l.high)})<br>${fmt(l.cost)} €/t · confidence ${l.confidence}<br>${l.basis||''}`)}"/>`;
    if(w>26) s += `<text x="${x+w/2}" y="${c>=0? y-3 : y+h+11}" text-anchor="middle">${l.id}</text>`;
    acc += l.abatement;
  });
  s += `<text x="${width/2}" y="${height-6}" text-anchor="middle">Cumulative abatement potential, tCO2e/yr (width) · bar height = €/tCO2e (capped ±600)</text>`;
  return s + `</svg>`;
}
// ---------- simple equirectangular GeoJSON map ----------
function geoMap(fc, {width=560, height=520, fill, tipFn, points=[] , filter}={}){
  const feats = fc.features.filter(f=>!filter||filter(f));
  let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
  const each = (g, fn) => { const polys = g.type==="Polygon"? [g.coordinates] : g.coordinates; polys.forEach(p=>p.forEach(r=>r.forEach(fn))); };
  feats.forEach(f=>each(f.geometry, ([x,y])=>{mnx=Math.min(mnx,x);mxx=Math.max(mxx,x);mny=Math.min(mny,y);mxy=Math.max(mxy,y);}));
  const k = Math.cos((mny+mxy)/2*Math.PI/180);
  const sc = Math.min(width/((mxx-mnx)*k), height/(mxy-mny));
  const P = ([x,y]) => [((x-mnx)*k*sc).toFixed(1), ((mxy-y)*sc).toFixed(1)];
  let s = `<svg class="chart map" viewBox="0 0 ${((mxx-mnx)*k*sc).toFixed(0)} ${((mxy-mny)*sc).toFixed(0)}">`;
  feats.forEach(f=>{
    const polys = f.geometry.type==="Polygon"? [f.geometry.coordinates] : f.geometry.coordinates;
    const d = polys.map(p=>p.map(r=>"M"+r.map(P).join("L")+"Z").join("")).join("");
    s += `<path d="${d}" fill="${fill(f)}" data-tip="${esc(tipFn(f))}"/>`;
  });
  points.filter(p=>p.lon>=mnx&&p.lon<=mxx&&p.lat>=mny&&p.lat<=mxy).forEach(p=>{ const [x,y]=P([p.lon,p.lat]); s += `<circle cx="${x}" cy="${y}" r="${p.r||3}" fill="${p.color||'#111'}" stroke="#fff" stroke-width="1" data-tip="${esc(p.tip||'')}"/>`; });
  return s + `</svg>`;
}
function seqColor(t){ const st=["#cde2fb","#9ec5f4","#6da7ec","#3987e5","#256abf","#184f95","#0d366b"]; return st[Math.max(0,Math.min(st.length-1, Math.floor(t*st.length)))]; }
const HDR={contracted_t:"Contracted t",mean_prod_t:"Mean prod. t",exp_shortfall_t:"Exp. shortfall t",exp_extra_cost_eur:"Exp. extra cost €/yr",p90_extra_cost_eur:"1-in-10 yr €",worst_year_extra_cost_eur:"1-in-100 yr €",exp_extra_tco2e:"Extra tCO2e/yr (imports)",added_irrigated_ha:"+ irrigated ha",delta_mean_prod_t:"Δ prod. t/yr",annual_benefit_incl_volume_eur:"Benefit €/yr",annual_cost_eur:"Cost €/yr",net_benefit_eur:"Net €/yr",region:"Region",crop:"Crop",scenario:"Scenario",option:"Option"};
function autoCols(rows, skip=[]){ const r0=rows[0]||{}; return Object.keys(r0).filter(k=>!skip.includes(k)).map(k=>({h:HDR[k]||k.replace(/_/g," "),n:typeof r0[k]==="number",f:r=>typeof r[k]==="number"?fmt(r[k],Math.abs(r[k])<10?2:0):esc(r[k]??"")})); }
function table(rows, cols, {max=400}={}){
  return `<div class="tbl"><table><thead><tr>${cols.map(c=>`<th class="${c.n?'n':''}">${esc(c.h)}</th>`).join("")}</tr></thead><tbody>${
    rows.slice(0,max).map(r=>`<tr>${cols.map(c=>`<td class="${c.n?'n':''}">${c.f? c.f(r) : esc(r[c.k])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function tokenize(s){ return (s.toLowerCase().match(/[a-zåäöü0-9%]+/g)||[]).filter(w=>w.length>2 && !STOP.has(w)); }

function retrieve(q, k=4){
  const qt = tokenize(q); const docs = DATA.kb;
  const N = docs.length; const df = {}; docs.forEach(d=>new Set(d._t||(d._t=tokenize(d.title+" "+d.text))).forEach(w=>df[w]=(df[w]||0)+1));
  return docs.map(d=>{ let s=0; const tf={}; d._t.forEach(w=>tf[w]=(tf[w]||0)+1); qt.forEach(w=>{ if(tf[w]) s += (1+Math.log(tf[w]))*Math.log(1+N/(df[w]||1)); }); return {d, s: s/Math.sqrt(d._t.length+20)}; })
    .filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,k).map(x=>x.d);
}

const SYS = `You are the Climate & Nature Navigator copilot for Apetit (Finnish food company: frozen vegetables, rapeseed oil, contract farmers in Finland and Sweden). The data is a synthetic twin (Since AI 2026 package) — say so if the user may mistake it for real figures.
Rules: 1) Use the tools to get facts; never answer numbers from memory and never invent or recompute figures beyond simple arithmetic you show. 2) Cite evidence for every claim as [evidence: ...] using the evidence strings returned by tools. 3) Follow GHG Protocol, SBTi (incl. FLAG), SBTN and NGFS logic; methodology changes and structural changes are never emission reductions. 4) If tools return nothing relevant, say you have no evidence and suggest asking an expert. 5) Be concise and decision-oriented: answer first, then 2-4 supporting points, then evidence. 6) Answer in the language of the question.`;
async function ask(){
  const q = $("#q").value.trim(); if(!q||busy) return; chat.push({r:"u",t:q}); audit("copilot_question","",q);
  const mode = aiMode();
  if(mode==="claude"){
    busy=true; const msg={r:"a",t:"Thinking…",tools:""}; chat.push(msg); render();
    const used=[]; const tools = TOOLS.map(t=>({...t, execute:(inp)=>{ used.push(t.name); msg.tools=used.join(", "); return t.execute(inp||{}); }}));
    const hist = chat.filter(m=>m!==msg).slice(-8).map(m=>({role:m.r==="u"?"user":"assistant",content:m.t}));
    hist[hist.length-1].content = SYS + "\n\nQuestion: " + q;
    try{
      const res = await SAMPLE(hist,{tools, cache:false, modelTier:"default", onText:({text})=>{ msg.t=text; const c=$("#chat"); if(c){ const els=c.querySelectorAll(".msg.a"); const el=els[els.length-1]; if(el) el.firstChild.textContent=text; } }});
      msg.t = res.text || msg.t;
    }catch(e){ const h=retrieve(q)[0]; msg.t = (e.code==="not_granted"?"AI access was not granted in this view. ":"AI call failed ("+(e.message||e.code)+"). ")+(h?"Best evidence found:\n\n"+h.text:""); msg.ev=h?.evidence; }
    busy=false; render(); setTimeout(()=>{ const c=$("#chat"); if(c) c.scrollTop=c.scrollHeight; },0); return;
  }
  const hits = retrieve(q);
  if(!hits.length){ chat.push({r:"a",t:"I found no evidence in the package for that. I will not guess — please rephrase or ask an expert."}); render(); return; }
  if(mode==="endpoint"){
    busy=true; chat.push({r:"a",t:"…thinking with "+hits.length+" evidence snippets"}); render();
    try{
      const ctx = hits.map((h,i)=>`[${i+1}] ${h.title}\n${h.text}\nEVIDENCE: ${h.evidence}`).join("\n\n");
      const res = await fetch(store.get("llm_url",""),{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+store.get("llm_key","")},body:JSON.stringify({model:store.get("llm_model",""),temperature:0,messages:[{role:"system",content:SYS+" Answer ONLY from the numbered evidence; cite [n]."},{role:"user",content:`Evidence:\n${ctx}\n\nQuestion: ${q}`}]})});
      const js = await res.json(); chat.pop();
      chat.push({r:"a",t:js.choices?.[0]?.message?.content || JSON.stringify(js).slice(0,400), ev: hits.map((h,i)=>`[${i+1}] ${h.evidence}`).join(" | ")});
    }catch(e){ chat.pop(); chat.push({r:"a",t:"LLM call failed ("+e.message+"). Retrieved evidence:\n\n"+hits[0].text, ev:hits[0].evidence}); }
    busy=false;
  } else {
    const h = hits[0]; chat.push({r:"a",t:h.text + (hits.length>1? `\n\nRelated: ${hits.slice(1).map(x=>x.title).join(" · ")}`:""), ev:h.evidence});
  }
  render(); setTimeout(()=>{ const c=$("#chat"); if(c) c.scrollTop=c.scrollHeight; $("#q")?.focus(); },0);
}

// ===================== SIMULATOR =====================
let simScen = "ndcs"; let simSel = null; let simScale = {};
function simDefault(){ const s=DATA.pathway.macc.filter(m=>m.scenario===simScen); const cp=s[0]?.carbon_price_2030||100; simSel={}; s.forEach(m=>{ if(m.cost_net<=cp) simSel[m.id]=true; }); simScale={}; }
function simRun(){
  const rows = DATA.pathway.rows.filter(r=>r.scenario===simScen); const L = DATA.pathway.levers.filter(l=>l.kind==="abatement");
  return rows.map(r=>{ const red={s12:0,s3nf:0,flag:0};
    L.forEach(l=>{ if(!simSel[l.id]||r.year<l.start) return; const a=l.abatement*(simScale[l.id]||1)*Math.min(1,(r.year-l.start+1)/Math.max(l.ramp,1));
      if(l.scope.startsWith("scope1")||l.scope.startsWith("scope2")) red.s12+=a; else if(l.flag && ["L13","L14","L15","L16","L17"].includes(l.id)){ red.flag+=a*0.86; red.s3nf+=a*0.14; } else if(l.flag) red.flag+=a; else red.s3nf+=a; });
    return {...r, sim_s12:r.bau_s12-red.s12, sim_s3nf:r.bau_s3nf-red.s3nf, sim_flag:r.bau_flag-red.flag}; });
}
function simAuto(){
  // greedy marginal-cost: repeatedly take the cheapest step (enable at 1x, or scale to 1.5x/2x at a cost penalty)
  // that serves a scope whose 2030 or 2035 target is still missed.
  const mm = Object.fromEntries(DATA.pathway.macc.filter(m=>m.scenario===simScen).map(m=>[m.id,m.cost_net]));
  const L = DATA.pathway.levers.filter(l=>l.kind==="abatement");
  const key = l => (l.scope.startsWith("scope1")||l.scope.startsWith("scope2"))? "s12" : (["L13","L14","L15","L16","L17"].includes(l.id)? "flag" : (l.flag?"flag":"s3nf"));
  simSel={}; simScale={};
  const gaps = () => { const r=simRun(); const g={s12:0,s3nf:0,flag:0}; [2030,2035].forEach(y=>{ const x=r.find(z=>z.year===y); for(const k in g) g[k]=Math.max(g[k], x["sim_"+k]-x["tgt_"+k]); }); return g; };
  for(let it=0; it<80; it++){
    const g = gaps(); if(Object.values(g).every(v=>v<=0)) break;
    const acts = [];
    L.forEach(l=>{ const k=key(l); const serves = g[k]>0 || (l.id==="L13"||l.id==="L14"||l.id==="L16") && (g.flag>0||g.s3nf>0); if(!serves) return;
      const cur = simSel[l.id]? (simScale[l.id]||1) : 0; const next = cur===0?1: cur===1?1.5: cur===1.5?2: null; if(next==null) return;
      acts.push({l, next, eff: mm[l.id] * (next>1 ? next : 1) + (next>1? 15:0)}); });
    if(!acts.length) break;
    acts.sort((a,b)=>a.eff-b.eff); const a=acts[0]; simSel[a.l.id]=true; if(a.next>1) simScale[a.l.id]=a.next;
  }
  audit("simulator_autoclose", simScen, JSON.stringify({simSel,simScale})); render();
}
page("simulator", "Simulator", () => {
  if(!simSel) simDefault();
  const R = simRun(); const L = DATA.pathway.levers.filter(l=>l.kind==="abatement"); const mm = Object.fromEntries(DATA.pathway.macc.filter(m=>m.scenario===simScen).map(m=>[m.id,m.cost_net]));
  const cost = L.filter(l=>simSel[l.id]).reduce((a,l)=>a+l.annual_cost_eur*(simScale[l.id]||1),0);
  const ab = L.filter(l=>simSel[l.id]).reduce((a,l)=>a+l.abatement*(simScale[l.id]||1),0);
  const cp = DATA.pathway.macc.find(m=>m.scenario===simScen)?.carbon_price_2030;
  const lab = {s12:"Scope 1+2",s3nf:"Scope 3 non-FLAG",flag:"FLAG"};
  const gap = (y,k) => { const x=R.find(z=>z.year===y); return x["sim_"+k]-x["tgt_"+k]; };
  const card = k => `<div class="card"><h3>${lab[k]}</h3>${lineChart([{name:"BAU",pts:R.map(r=>[r.year,r["bau_"+k]]),color:"var(--ink-3)",dash:1},{name:"Your plan",pts:R.map(r=>[r.year,r["sim_"+k]]),color:"var(--s1)"},{name:"Target",pts:R.map(r=>[r.year,r["tgt_"+k]]),color:"var(--s6)",dash:1}],{width:420,height:220,x0:2025,x1:2035,yFmt:v=>fmt(v/1000,1)+"k"})}
    <p class="small">2030 gap <b>${fmt(gap(2030,k))} t</b> ${gap(2030,k)<=0?'<span class="pill ok">met</span>':'<span class="pill no">gap</span>'} · 2035 gap <b>${fmt(gap(2035,k))} t</b> ${gap(2035,k)<=0?'<span class="pill ok">met</span>':'<span class="pill no">gap</span>'}</p></div>`;
  return `<h1>What-if simulator · build your own transition plan</h1>
  <p class="lead">Digital-twin of the pathway: switch levers on or off and scale them, under any NGFS scenario, and see in real time whether the SBTi targets for Scope 1+2, Scope 3 non-FLAG and FLAG are met in 2030 and 2035, and what it costs. "Auto-close the gap" picks the cheapest levers first and flags any lever scaled beyond its design estimate for expert validation.</p>
  <div class="row" style="margin-bottom:12px"><select onchange="simScen=this.value;simDefault();render()">${DATA.pathway.scenarios.map(s=>`<option ${s===simScen?'selected':''}>${s}</option>`).join("")}</select>
    <button class="btn" onclick="simDefault();render()">Levers below carbon price (€${fmt(cp)}/t)</button><button class="btn" onclick="simSel={};simScale={};render()">None</button><button class="btn pri" onclick="simAuto()">Auto-close the gap</button>
    <span class="small muted">Plan: ${Object.keys(simSel).filter(k=>simSel[k]).length} levers · ${fmt(ab)} tCO2e/yr at full ramp · €${fmt(cost/1e6,2)} m/yr · avg €${fmt(ab?cost/ab:0)}/t</span></div>
  <div class="grid g3">${card("s12")}${card("s3nf")}${card("flag")}</div>
  <div class="card" style="margin-top:14px">${table(L.slice().sort((a,b)=>mm[a.id]-mm[b.id]),[
    {h:"On",f:r=>`<input type="checkbox" ${simSel[r.id]?"checked":""} onchange="simSel['${r.id}']=this.checked;render()">`},
    {h:"Id",k:"id"},{h:"Lever",k:"name"},{h:"Scope",f:r=>r.flag?"FLAG":r.scope},{h:"t/yr",n:1,f:r=>fmt(r.abatement*(simScale[r.id]||1))},{h:"net €/t",n:1,f:r=>fmt(mm[r.id])},{h:"Start",k:"start"},{h:"Conf.",k:"confidence"},
    {h:"Scale",f:r=>`<select onchange="simScale['${r.id}']=+this.value;render()">${[0.5,1,1.5,2].map(v=>`<option value="${v}" ${(simScale[r.id]||1)===v?'selected':''}>${v}×</option>`).join("")}</select>${(simScale[r.id]||1)>1?' <span class="pill wa">beyond design — validate</span>':''}`}],{max:40})}</div>`;
});

let tourIdx = -1;
function startTour(){ tourIdx = 0; go(TOUR[0][0]); }
function tourStep(d){ tourIdx = Math.max(0, Math.min(TOUR.length-1, tourIdx+d)); go(TOUR[tourIdx][0]); }
function endTour(){ tourIdx = -1; renderTour(); }
window.renderTour = function(){
  const el = document.getElementById("tourbar"); if(!el) return;
  if(tourIdx<0){ el.innerHTML=""; document.body.style.paddingBottom="0"; return; }
  const i = TOUR.findIndex(t=>t[0]===current); if(i>=0) tourIdx=i;
  document.body.style.paddingBottom="90px";
  el.innerHTML = `<div class="in"><b style="white-space:nowrap">${tourIdx+1} / ${TOUR.length}</b><span style="flex:1">${esc(TOUR[tourIdx][1])}</span>
    <button class="btn sm" onclick="tourStep(-1)" ${tourIdx===0?"disabled":""}>◂ Back</button>

};
